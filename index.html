<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Classroom - Panel Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="dashboard-card">
        <!-- Cabecera de la Tarjeta -->
        <div class="card-header">
            <div class="info-title">
                <h2>Aula Digital 304</h2>
                <p>Programación Web Avanzada</p>
            </div>
            <span class="status-pill">● EN VIVO</span>
        </div>

        <!-- Cuerpo Dividido en Dos Columnas (Grid) -->
        <div class="card-body">
            <!-- Columna Izquierda: Estadísticas -->
            <div class="stat-box-modern">
                <span class="stat-number">28</span>
                <span class="stat-label">Alumnos Activos</span>
            </div>

            <!-- Columna Derecha: Progreso y Detalles -->
            <div class="progress-section">
                <div class="progress-info">
                    <span>Participación</span>
                    <span class="percentage">85%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill"></div>
                </div>
            </div>
        </div>

        <!-- Pie de Tarjeta con Botón de Acción Ancho -->
        <div class="card-footer">
            <button class="action-btn">Acceder al Aula Virtual</button>
        </div>
    </div>

</body>
</html>
